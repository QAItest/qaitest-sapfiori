name: sap-fiori-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright-sap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
        env:
          SAP_BASE_URL: ${{ secrets.SAP_FIORI_BASE_URL }}
          SAP_USERNAME: ${{ secrets.SAP_FIORI_USERNAME }}
          SAP_PASSWORD: ${{ secrets.SAP_FIORI_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sap-fiori-test-reports
          path: reports/
